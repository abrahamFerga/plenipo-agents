name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# HARNESS.md argues that a claim with no deterministic verifier is a level-4 opinion.
# This workflow is what stops that argument from being theatre about this repo itself.
jobs:
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # L1 — the repo's own invariants: manifests, frontmatter, link resolution,
      # plugin-root containment, description overlap, portability.
      - name: Validate marketplace invariants
        run: node eng/validate-marketplace.mjs

      # L1 — the cross-tool index in AGENTS.md must match the skills on disk. Codex and Copilot
      # route from that index, and a stale one sends them to files that moved or no longer exist.
      - name: Check the cross-tool skill index is in sync
        run: node eng/generate-agent-docs.mjs --check

      # L1 — merge-gate.mjs is shipped as an asset and copied verbatim into every product and the
      # platform, so a defect here is a defect in five repos at once. It is also the last automated
      # thing before `main` in each of them. This ran red against the previous asset.
      - name: Prove the merge gate's check-rollup handling
        run: node plugins/plenipo/skills/setup/assets/merge-gate.test.mjs

      # L1 — this repo runs the gate it ships, so its installed copy must BE the asset. The step
      # above proves the ASSET is correct and says nothing about the copies, and the comment above
      # it asserted "copied verbatim into every product" without ever checking. The first time
      # anyone checked: this repo's own copy was ~100 lines behind, the platform's was ~50 behind,
      # and three products were 47 lines AHEAD, carrying two fixes that never came back here. CI
      # was green through all of it, because nothing compared them.
      - name: Prove the installed merge gate has not drifted from the asset
        run: |
          diff --strip-trailing-cr \
            plugins/plenipo/skills/setup/assets/merge-gate.mjs \
            .github/scripts/merge-gate.mjs \
            || { echo "::error::.github/scripts/merge-gate.mjs has drifted from the asset it is vendored from — re-copy it, or port the local change up"; exit 1; }

      # L2 — prose conventions.
      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"
