name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# HARNESS.md argues that a claim with no deterministic verifier is a level-4 opinion.
# This workflow is what stops that argument from being theatre about this repo itself.
jobs:
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # L1 — the repo's own invariants: manifests, frontmatter, link resolution,
      # plugin-root containment, description overlap, portability.
      - name: Validate marketplace invariants
        run: node eng/validate-marketplace.mjs

      # L1 — the vendor's own manifest validator, in strict mode, so a field the runtime would
      # tolerate silently fails here instead. Pinned like every other tool; bump it deliberately.
      # Needs no login, and the env var keeps it from phoning home.
      - name: Validate manifests with Claude Code's own validator
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.266
          claude plugin validate --strict .
          for plugin in plugins/*/; do claude plugin validate --strict "$plugin"; done

      # L1 — the cross-tool index in AGENTS.md must match the skills on disk. Codex and Copilot
      # route from that index, and a stale one sends them to files that moved or no longer exist.
      - name: Check the cross-tool skill index is in sync
        run: node eng/generate-agent-docs.mjs --check

      # L1 — these files are shipped as one unattended state machine. Prove the deterministic PR
      # policy, merger, and issue-triage recovery that the live workflow actually executes.
      - name: Prove the unattended PR loop
        run: |
          node plugins/plenipo/skills/setup/assets/pr-gates.test.mjs
          node plugins/plenipo/skills/setup/assets/merge-gate.test.mjs
          node plugins/plenipo/skills/setup/assets/triage-retry.test.mjs

      # L1 — this repo runs the controls it ships, so every installed source must remain byte-for-
      # byte equivalent to its canonical asset. A drifted local copy is an untested policy fork.
      - name: Prove the installed loop has not drifted from its assets
        run: |
          while IFS='|' read -r asset installed; do
            diff --strip-trailing-cr "$asset" "$installed" || {
              echo "::error::$installed has drifted from $asset — re-copy it, or port the local change up"
              exit 1
            }
          done <<'EOF'
          plugins/plenipo/skills/setup/assets/pr-gates.mjs|.github/scripts/pr-gates.mjs
          plugins/plenipo/skills/setup/assets/pr-gates.test.mjs|.github/scripts/pr-gates.test.mjs
          plugins/plenipo/skills/setup/assets/merge-gate.mjs|.github/scripts/merge-gate.mjs
          plugins/plenipo/skills/setup/assets/merge-gate.test.mjs|.github/scripts/merge-gate.test.mjs
          plugins/plenipo/skills/setup/assets/fixtures/check-rollup.json|.github/scripts/fixtures/check-rollup.json
          plugins/plenipo/skills/setup/assets/triage-retry.mjs|.github/scripts/triage-retry.mjs
          plugins/plenipo/skills/setup/assets/triage-retry.test.mjs|.github/scripts/triage-retry.test.mjs
          plugins/plenipo/skills/setup/assets/agent-gates.yml|.github/workflows/agent-gates.yml
          plugins/plenipo/skills/setup/assets/agent-merge.yml|.github/workflows/agent-merge.yml
          plugins/harness/skills/install-github-agentic-workflows/assets/pr-approval-verdict.md|.github/workflows/pr-approval-verdict.md
          EOF

      # L2 — prose conventions.
      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "#node_modules"
