# OPTIONAL — the cloud reviewer. Everything else in this setup works without it.
#
# ---------------------------------------------------------------------------------------------
# VERIFY BEFORE ENABLING. The two lines marked (verify) below depend on the Claude Code CLI's
# headless flags, which move. Run `claude --help` on the version you install and correct them, or
# run the workflow once with `workflow_dispatch` on a throwaway PR and read the log. Do not put
# this in a repo you care about on the strength of it having been written down.
# ---------------------------------------------------------------------------------------------
#
# Why you might not need it: `/plenipo:ship` already runs the `pr-reviewer` agent locally, in a
# fresh context, for free under your existing Claude Code subscription. This workflow exists for the
# case where nobody is at the machine and you still want review to happen — it costs API tokens and
# requires a secret in the repo, which the local path does not.
#
# It can only comment and label. It cannot merge, cannot push, and cannot approve in GitHub's sense.
# Merging remains `agent-merge.yml`'s job, gated on the label this sets.
name: Agent review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Adversarial review
    if: startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code # (verify) package name and that -g works on the runner

      - name: Review the diff and set the verdict label
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR" > /tmp/pr.diff
          gh pr view "$PR" --json title,body,number > /tmp/pr.json

          cat > /tmp/prompt.md <<'PROMPT'
          You are reviewing one pull request as an adversary. Try to REFUTE the claim that it does
          what its issue asked. You cannot edit, push, label, or merge anything.

          Read /tmp/pr.json and /tmp/pr.diff, and the issue the body says it closes.

          Answer all five questions, then give one verdict:
            1. Is every acceptance criterion satisfied, and by which specific line or test?
            2. Is the evidence real — would the named regression test fail if the change were reverted?
            3. Was a check bent instead of satisfied? Look for a modified assertion, a loosened eval,
               a deleted case, a removed query filter, RequiresApproval flipped to false, a widened
               permission string, a catch that swallows the failure the test watched for.
            4. Does it violate a platform invariant — RBAC before the model, approval-first writes,
               tenant isolation, write-only secrets, append-only audit? Also: a ToolDescriptor with
               no matching ModuleTool, or a module entity with no HasQueryFilter.
            5. Is the scope the issue's scope?

          Default to request-changes when unsure: a wrongly blocked PR costs one iteration, a wrongly
          merged one costs a revert and the credibility of every green check after it.

          End your output with exactly one line: VERDICT: approve | VERDICT: request-changes |
          VERDICT: escalate
          PROMPT

          # (verify) headless flags: -p prints and exits; keep the tool set read-only.
          claude -p "$(cat /tmp/prompt.md)" --allowedTools "Read,Grep,Glob,Bash(gh issue view:*)" \
            > /tmp/review.md || { echo "review failed — leaving the PR unlabelled"; exit 1; }

          gh pr comment "$PR" --body-file /tmp/review.md

          if grep -qE '^VERDICT: approve' /tmp/review.md; then
            gh pr edit "$PR" --add-label 'agent:approved' --remove-label 'agent:changes-requested'
          elif grep -qE '^VERDICT: request-changes' /tmp/review.md; then
            gh pr edit "$PR" --add-label 'agent:changes-requested' --remove-label 'agent:approved'
          else
            # No parseable verdict is NOT an approval. Escalate rather than defaulting open.
            gh pr edit "$PR" --add-label 'needs-human' --remove-label 'agent:approved'
          fi
